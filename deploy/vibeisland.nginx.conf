limit_req_zone $binary_remote_addr zone=vibe_api:10m rate=5r/s;
server {
    listen 80;
    listen [::]:80;
    server_name vibeisland.fun;
    root /opt/vibe-island/current/dist-local;
    index index.html;
    client_max_body_size 512k;
    access_log off;
    error_log /var/log/nginx/vibe-island-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location /api/ {
        limit_req zone=vibe_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ =404; expires -1; }
}
